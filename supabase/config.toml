# Supabase CLI config for local development (`supabase start`) and function settings on deploy.
# The hosted project lives in Mumbai (ap-south-1, decision D7). The region is chosen when the project
# is created in the dashboard; it is not a setting in this file. See supabase/README.md.

project_id = "paw-noon"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
# Reserved for live duels (phase 2, D1b).
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["com.pawnoon.pixel://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Guests play instantly (D5); Apple/Google identities are linked to the same user later (§5).
enable_anonymous_sign_ins = true
enable_manual_linking = true

[auth.rate_limit]
anonymous_users = 30

[auth.email]
# No email/password (SPEC_V2 §5).
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
# Native Google Sign-In on Android/iOS sends an ID token; no nonce on Android.
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Every function requires a valid Supabase Auth JWT (guest sessions included).
[functions.match-start]
verify_jwt = true

[functions.match-submit]
verify_jwt = true

[functions.account-delete]
verify_jwt = true

[functions.daily-claim]
verify_jwt = true

[functions.purchase-validate]
verify_jwt = true

[functions.room-create]
verify_jwt = true

[functions.room-join]
verify_jwt = true

[functions.leaderboard-read]
verify_jwt = true
